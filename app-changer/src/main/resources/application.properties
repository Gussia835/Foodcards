quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-21

quarkus.native.debug.enabled=false
quarkus.native.add-all-charsets=false

quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://pom_db:5432/pom_db
%prod.quarkus.datasource.username=pom
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD:password}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect

# quarkus.rest-client.app-controller.url=http://app-controller:8081
quarkus.rest-client.app-controller.scope=jakarta.inject.Singleton

quarkus.micrometer.registry-enabled-default=true

%prod.kafka.bootstrap.servers=kafka:9092
%prod.app.kafka.bootstrap-servers=kafka:9092
app.kafka.group-id-prefix=app-changer-group
app.kafka.auto-offset-reset=earliest
app.kafka.poll-timeout-ms=100
app.kafka.concurrency.default=1
app.kafka.concurrency.gru-balance=3

app.node-id=162
app.batch-size=50
app.process.interval=3s
app.egress.interval=2s
app.stuck-check.interval=5m


%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:15-alpine
%test.quarkus.datasource.devservices.init-script-path=init-schema.sql

%test.quarkus.hibernate-orm.database.generation=drop-and-create

%test.quarkus.scheduler.enabled=false

%test.app.node-id=test-node-01
%test.app.batch-size=10

%test.quarkus.kafka.devservices.enabled=true
%test.kafka.bootstrap.servers=localhost:9092
%test.app.kafka.bootstrap-servers=localhost:9092

