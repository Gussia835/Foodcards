quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:24.1-java21

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://pom_db:5432/pom_db
quarkus.datasource.username=pom
quarkus.datasource.password=${POSTGRES_PASSWORD:password}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect

quarkus.rest-client.app-controller.url=http://app-controller:8081
quarkus.rest-client.app-controller.scope=jakarta.inject.Singleton

quarkus.micrometer.registry-enabled-default=true

app.kafka.bootstrap-servers=kafka:9092
app.kafka.group-id-prefix=app-changer-group
app.kafka.auto-offset-reset=earliest
app.kafka.poll-timeout-ms=100
app.kafka.concurrency.default=1
app.kafka.concurrency.gru-balance=3

app.node-id=162
app.batch-size=50
app.process.interval=3s
app.egress.interval=2s
app.stuck-check.interval=5m

