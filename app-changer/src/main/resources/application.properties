quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:24.1-java21

mp.messaging.incoming.gru-balance-in.connector=smallrye-kafka
mp.messaging.incoming.gru-balance-in.topic=${app.topic.in.balance:gru.balance.in}
mp.messaging.incoming.gru-balance-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.gru-balance-in.auto.offset.reset=earliest

mp.messaging.outgoing.gru-balance-out.connector=smallrye-kafka
mp.messaging.outgoing.gru-balance-out.topic=${app.topic.out.balance:gru.balance.out}
mp.messaging.outgoing.gru-balance-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.gru-food-in.connector=smallrye-kafka
mp.messaging.incoming.gru-food-in.topic=${app.topic.in.food:gru.food.in}
mp.messaging.incoming.gru-food-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.gru-food-in.auto.offset.reset=earliest

mp.messaging.outgoing.gru-food-out.connector=smallrye-kafka
mp.messaging.outgoing.gru-food-out.topic=${app.topic.out.food:gru.food.out}
mp.messaging.outgoing.gru-food-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

quarkus.datasource.db-kind=oracle
quarkus.datasource.jdbc.url=jdbc:oracle:thin:@gru_db:1521/XEPDB1
quarkus.datasource.username=GRU
quarkus.datasource.password=${GRU_APP_PASSWORD:password}

quarkus.hibernate-orm.database.generation=none

quarkus.rest-client.app-controller.url=http://app-controller:8081
quarkus.rest-client.app-controller.scope=jakarta.inject.Singleton

app.node-id=162
app.batch-size=50
app.process.interval=3s
app.egress.interval=2s
app.stuck-check.interval=5m