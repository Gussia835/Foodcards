spring:
  application:
    name: app-adapter

  datasource:
    url: jdbc:oracle:thin:@oracle:1521/XEPDB1
    username: GRU
    password: ${GRU_APP_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: app-adapter-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: foodcards.adapter.models
  configuration:
    map-underscore-to-camel-case: true

app:
  kafka:
    batch-size: 100
    sleep-time-ms: 5000
    topic-out-balance: gru.balance.out
    topic-in-balance: gru.balance.in
    topic-out-food: gru.food.out
    topic-in-food: gru.food.in